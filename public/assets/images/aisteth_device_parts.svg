<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="350" fill="#F8FAFC" rx="16"/>

  <text x="200" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">AiSteth Digital Stethoscope Components</text>

  <!-- Device Body -->
  <g transform="translate(100, 50)">
    <!-- Main Capsule -->
    <rect x="50" y="30" width="100" height="180" rx="50" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    
    <!-- Metallic Grip Ring -->
    <rect x="52" y="110" width="96" height="20" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>

    <!-- Diaphragm Head (Bottom sensor) -> x: 50%, y: 70% in full svg -->
    <circle cx="100" cy="190" r="36" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="3"/>
    <circle cx="100" cy="190" r="26" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.5"/>
    <circle cx="100" cy="190" r="10" fill="#2563EB"/>
    <text x="100" y="240" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E40AF" text-anchor="middle">Acoustic Diaphragm</text>

    <!-- Power / Action Button -> x: 50%, y: 25% in full svg -->
    <circle cx="100" cy="65" r="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    <path d="M100,53 L100,63 M94,56 A9,9 0 1,0 106,56" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
    <text x="100" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#2563EB" text-anchor="middle">Power Button</text>

    <!-- LED Status Indicator -> x: 50%, y: 38% in full svg -->
    <circle cx="100" cy="100" r="6" fill="#16A34A" stroke="#BBF7D0" stroke-width="2"/>
    <text x="145" y="104" font-family="system-ui, sans-serif" font-size="9" fill="#16A34A" font-weight="bold">LED Indicator</text>
  </g>
</svg>
